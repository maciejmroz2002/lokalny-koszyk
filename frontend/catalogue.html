<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalog — Lokalny Koszyk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-logo">Lokalny Koszyk</a>
      <div class="navbar-links">
        <a href="catalogue.html" class="navbar-link active">Katalog</a>
        <span id="navAuthLink"></span>
      </div>
    </div>
  </nav>

  <div class="catalogue-page">
    <h1>Katalog produktów</h1>
    <div id="productsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.5rem;padding:2rem;"></div>
  </div>

  <!-- Modal detail -->
  <div class="modal-overlay" id="detailOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="detailName"></h3>
        <button class="modal-close" onclick="closeDetail()">&times;</button>
      </div>
      <div class="modal-body">
        <div class="profile-grid">
          <div class="profile-field"><label>Lokalizacja</label><span id="detailLoc"></span></div>
          <div class="profile-field"><label>Cena</label><span id="detailPrice"></span></div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/app.js?v=20250610-auth"></script>
  <script>
    // Auth link in navbar
    const user = getCurrentUser();
    document.getElementById('navAuthLink').innerHTML = user
      ? `<a href="dashboard.html" class="navbar-link btn-login">Panel</a>`
      : `<a href="login.html" class="navbar-link btn-login">Zaloguj się</a>`;

    // Load and render catalogue
    async function loadCatalogue() {
      try {
        const headers = {};
        const token = localStorage.getItem('jwtToken');
        if (token) {
          headers['Authorization'] = 'Bearer ' + token;
        }
        
        const res = await fetch('/api/catalogue', { headers });
        if (!res.ok) throw new Error('API error');
        
        const products = await res.json();
        const grid = document.getElementById('productsGrid');
        
        if (!products || !products.length) {
          grid.innerHTML = '<p style="color:var(--text-muted);padding:2rem;">Brak produktów w katalogu.</p>';
          return;
        }
        
        grid.innerHTML = products.map(p => `
          <div class="product-card" onclick="openDetail(${p.product_id},'${esc(p.product_name)}','${esc(p.product_location || '')}',${p.product_price || 0})" style="border:1px solid #ddd;border-radius:8px;padding:1.5rem;cursor:pointer;">
            <h3 style="margin:0 0 0.5rem;font-size:1.1rem;">${esc(p.product_name)}</h3>
            ${p.product_location ? `<div class="product-meta" style="color:#666;font-size:0.9rem;margin-bottom:0.5rem;"><i data-lucide="map-pin" style="width:1em;height:1em;vertical-align:middle;"></i> ${esc(p.product_location)}</div>` : ''}
            ${p.product_price ? `<div class="product-price" style="font-weight:bold;margin-top:0.5rem;color:#27ae60;">${p.product_price.toFixed(2)} zł</div>` : '<div style="color:#999;font-size:0.9rem;">Cena: dostępna dla zalogowanych</div>'}
            <p style="margin:0.5rem 0 0;font-size:0.85rem;color:#666;">${p.category || 'Bez kategorii'}</p>
          </div>
        `).join('');
        lucide.createIcons();
      } catch (e) {
        console.error('Failed to load catalogue:', e);
        document.getElementById('productsGrid').innerHTML = '<p style="color:var(--danger);padding:2rem;">Nie udało się wczytać katalogu.</p>';
      }
    }

    function openDetail(id, name, loc, price) {
      document.getElementById('detailName').textContent = name;
      document.getElementById('detailLoc').textContent = loc || 'Brak informacji';
      document.getElementById('detailPrice').textContent = price > 0 ? price.toFixed(2) + ' zł' : 'Zaloguj się, aby zobaczyć cenę';
      document.getElementById('detailOverlay').classList.add('open');
    }
    function closeDetail() {
      document.getElementById('detailOverlay').classList.remove('open');
    }
    document.getElementById('detailOverlay').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) closeDetail();
    });
    function esc(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    
    // Load on page load
    loadCatalogue();
  </script>
</body>
</html>
