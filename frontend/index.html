<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lokalny Koszyk</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-container">
      <a href="index.html" class="navbar-logo">Lokalny Koszyk</a>
      <div class="navbar-links">
        <a href="catalogue.html" class="navbar-link">Katalog</a>
        <a href="login.html" class="navbar-link btn-login">Zaloguj się</a>
      </div>
    </div>
  </nav>

  <main class="landing">
    <h1>Hurtownia<br>produktów regionalnych.</h1>
    <p>Zarządzaj zapasami, dostawami i zamówieniami w jednym miejscu.</p>
    <div class="landing-actions">
      <a href="catalogue.html" class="btn btn-secondary">Przeglądaj katalog</a>
      <a href="login.html" class="btn btn-primary">Zaloguj się</a>
      <a href="docs.html" class="btn btn-secondary">Dokumentacja</a>
    </div>
  </main>

  <!-- Products Grid (no prices, no location) -->
  <section style="max-width:1200px;margin:3rem auto;padding:0 2rem;">
    <h2 style="text-align:center;margin-bottom:2rem;">Dostępne produkty</h2>
    <div id="homeProductsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:1.5rem;"></div>
  </section>

  <script src="js/app.js?v=20250610-auth"></script>
  <script>
    // If already logged in, redirect to dashboard
    if (getCurrentUser()) window.location.replace('dashboard.html');
    
    // Load products without prices or location
    async function loadHomeProducts() {
      try {
        const res = await fetch('/api/catalogue');
        if (!res.ok) return;
        const products = await res.json();
        const grid = document.getElementById('homeProductsGrid');
        grid.innerHTML = products.map(p => `
          <div style="border:1px solid #ddd;border-radius:8px;padding:1.5rem;">
            <h3 style="margin:0 0 0.5rem;font-size:1.1rem;">${p.product_name}</h3>
            <p style="margin:0;color:#666;font-size:0.9rem;">${p.category || 'Bez kategorii'}</p>
          </div>
        `).join('');
      } catch (e) {
        console.error('Failed to load products:', e);
      }
    }
    loadHomeProducts();
  </script>
</body>
</html>
